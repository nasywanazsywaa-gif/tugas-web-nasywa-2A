<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tugas 3 JavaScript</h1>

    <script type="text/javascript">
        let angka = 10;
        let angka2 = 5;

        //penjumlahan
        let hasil = angka + angka2;
        document.write("Hasil Penjumlahan : " + hasil + "<br>");
        //pengurangan
        let hasil2 = angka - angka2;
        document.write("Hasil Pengurangan : " + hasil2 + "<br>");
         //perkalian 
        let hasil3 = angka * angka2;
        document.write("Hasil Perkalian : " + hasil3 + "<br>");
        //pembagian
        let hasil4 = angka / angka2;
        document.write("Hasil Pembagian : " + hasil4 + "<br>");
    </script>
</body>
</html>
